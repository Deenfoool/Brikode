<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Brikode — build bots and automations with blocks or code, then export them for self-hosting.">
  <meta name="theme-color" content="#080b14">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https:; worker-src 'self' blob: data: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>Brikode — Blocks + Code</title>
  <link rel="stylesheet" href="./assets/app.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <noscript>
    <div class="noscript">Brikode requires JavaScript.</div>
  </noscript>

  <div id="app" class="app-root" aria-live="polite"></div>

  <dialog id="cloudDialog" class="modal">
    <form method="dialog" class="modal-card">
      <div class="eyebrow">CLOUD DEPLOY</div>
      <h2>Coming soon</h2>
      <p>
        Brikode v1 intentionally deploys through Export / Self-host.
        Hosted execution will be enabled only after isolated workers,
        encrypted secrets, logging and deployment lifecycle are ready.
      </p>
      <div class="modal-actions">
        <button class="button button-primary" value="close">Got it</button>
      </div>
    </form>
  </dialog>

  <div id="toastRegion" class="toast-region" aria-live="assertive"></div>

  <script src="https://cdn.jsdelivr.net/npm/blockly@13.2.0/blockly_compressed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/blockly@13.2.0/blocks_compressed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/blockly@13.2.0/msg/en.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.57.0/min/vs/loader.js"></script>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
